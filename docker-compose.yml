services:
  db:
    image: postgres:16-alpine
    container_name: inego-db
    environment:
      POSTGRES_DB: inego
      POSTGRES_USER: inego
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inego}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inego -d inego"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: inego-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://inego:${POSTGRES_PASSWORD:-inego}@db:5432/inego
      # Пустой — сгенерируется временный (сессии сбросятся при перезапуске)
      JWT_SECRET: ${JWT_SECRET:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # ComfyUI обычно крутится на хосте рядом с GPU
      COMFYUI_URL: ${COMFYUI_URL:-http://host.docker.internal:8188}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # только локально — для dev-сервера Vite (npm run dev)
      - "127.0.0.1:${BACKEND_PORT:-8010}:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # true — генерация имитируется в браузере; false — запросы идут в backend
        VITE_USE_MOCK: ${VITE_USE_MOCK:-true}
    container_name: inego-frontend
    ports:
      - "${INEGO_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
