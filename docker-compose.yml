services:
  db:
    image: postgres:16-alpine
    container_name: inego-db
    environment:
      POSTGRES_DB: inego
      POSTGRES_USER: inego
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inego}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inego -d inego"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: inego-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://inego:${POSTGRES_PASSWORD:-inego}@db:5432/inego
      # Пустой — сгенерируется временный (сессии сбросятся при перезапуске)
      JWT_SECRET: ${JWT_SECRET:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # По умолчанию — сервис comfyui ниже; ComfyUI на хосте: http://host.docker.internal:8188
      COMFYUI_URL: ${COMFYUI_URL:-http://comfyui:8188}
      # DeepSeek: описывает исходник и собирает промпт (без ключа — промпт из пресета)
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # только локально — для dev-сервера Vite (npm run dev)
      - "127.0.0.1:${BACKEND_PORT:-8010}:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # true — генерация имитируется в браузере; false — запросы идут в backend
        VITE_USE_MOCK: ${VITE_USE_MOCK:-true}
    container_name: inego-frontend
    ports:
      - "${INEGO_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  comfyui:
    build: ./comfyui
    container_name: inego-comfyui
    # Первый старт докачивает ~12 ГБ моделей в volume comfy_models
    gpus: all
    environment:
      COMFYUI_ARGS: ${COMFYUI_ARGS:-}
    volumes:
      - comfy_models:/opt/ComfyUI/models
      - comfy_output:/opt/ComfyUI/output
    ports:
      # UI ComfyUI — только локально, для отладки workflow
      - "127.0.0.1:${COMFYUI_PORT:-8188}:8188"
    restart: unless-stopped

volumes:
  pgdata:
  comfy_models:
  comfy_output:
